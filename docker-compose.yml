services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dexplay
      POSTGRES_USER: dexplay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD in .env}
    volumes: ["dexplay_db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dexplay -d dexplay"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["dexplay_redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: ./api
    restart: unless-stopped
    env_file: ./api/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://dexplay:${POSTGRES_PASSWORD}@postgres:5432/dexplay
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 5
  worker:
    build: ./api
    restart: unless-stopped
    env_file: ./api/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://dexplay:${POSTGRES_PASSWORD}@postgres:5432/dexplay
      REDIS_URL: redis://redis:6379/0
    command: ["celery", "-A", "app.celery_app.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  web:
    build: ./web
    restart: unless-stopped
    ports: ["8080:8080"]
    depends_on: [api]
volumes:
  dexplay_db:
  dexplay_redis:
